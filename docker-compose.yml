services:
  FlameForge:
    build:
      context: .
      dockerfile: Dockerfile
    image: eful97/FlameForge:latest
    container_name: FlameForge
    restart: unless-stopped
    ports:
      # Host bind/porta configurabili (default 0.0.0.0:8080). La porta interna
      # resta 8080 (PORT/HOSTNAME sotto + healthcheck): cambia solo l'esposizione.
      - "${FLAMEFORGE_BIND_IP:-0.0.0.0}:${FLAMEFORGE_HOST_PORT:-8080}:8080"
    environment:
      # â”€â”€ Chiavi API â”€â”€
      # PrioritÃ : header `x-api-key` > query `api_key`/`mdblist_key` > fallback
      # d'istanza qui sotto (opt-in, vedi resolveRequestApiKey in src/lib/tmdb.ts).
      # Il fallback d'istanza Ã¨ per deploy personali single-user; su istanze
      # pubbliche multi-utente NON impostarlo (ogni richiesta porta la sua chiave).
      # Consigliato per integratori: TMDB per-utente + MDBList d'istanza
      # (il mdblist_key per-richiesta frammenta la cache poster) â€” docs/INTEGRATION.md.
      - FLAMEFORGE_TMDB_KEY=${FLAMEFORGE_TMDB_KEY:-${FLAMEFORGE_TMDB_KEY:-}}
      - FLAMEFORGE_MDBLIST_KEY=${FLAMEFORGE_MDBLIST_KEY:-${FLAMEFORGE_MDBLIST_KEY:-}}
      - FLAMEFORGE_TVDB_API_KEY=${FLAMEFORGE_TVDB_API_KEY:-${FLAMEFORGE_TVDB_API_KEY:-}}
      # â”€â”€ Custom Rating Provider â”€â”€
      # Endpoint/header configurabili anche dall'editor (vince sul qui sotto);
      # la chiave resta SEMPRE env (mai in UI/token/URL).
      - FLAMEFORGE_CUSTOM_RATING_ENABLED=${FLAMEFORGE_CUSTOM_RATING_ENABLED:-${FLAMEFORGE_CUSTOM_RATING_ENABLED:-}}
      - FLAMEFORGE_CUSTOM_RATING_ENDPOINT=${FLAMEFORGE_CUSTOM_RATING_ENDPOINT:-${FLAMEFORGE_CUSTOM_RATING_ENDPOINT:-}}
      - FLAMEFORGE_CUSTOM_RATING_API_KEY=${FLAMEFORGE_CUSTOM_RATING_API_KEY:-${FLAMEFORGE_CUSTOM_RATING_API_KEY:-}}
      - FLAMEFORGE_CUSTOM_RATING_API_KEY_HEADER=${FLAMEFORGE_CUSTOM_RATING_API_KEY_HEADER:-${FLAMEFORGE_CUSTOM_RATING_API_KEY_HEADER:-}}
      - FLAMEFORGE_CUSTOM_RATINGS=${FLAMEFORGE_CUSTOM_RATINGS:-${FLAMEFORGE_CUSTOM_RATINGS:-}}
      # â”€â”€ Opzionali â€” Multi-utente (istanza pubblica per-UUID) â”€â”€
      # FLAMEFORGE_MULTI_USER=1 abilita mapping/default/chiavi per UUID
      # (POST /api/users, gestione su /u/<uuid>/configure). Default off =
      # single-user invariato. PROFILE_ENCRYPTION_KEY obbligatoria con flag
      # ON (fail-closed sul salvataggio chiavi); retention cleanup inattivi
      # (0 = mai). Quota poster per UUID via MAX_MAPPINGS, cap namespace via
      # MAX_USERS. Con flag ON le richieste scoped (?u=) NON usano le chiavi
      # d'istanza (mai open-proxy sulla quota operatore) salvo
      # MULTI_USER_ALLOW_ENV_FALLBACK=1.
      - FLAMEFORGE_MULTI_USER=${FLAMEFORGE_MULTI_USER:-}
      - FLAMEFORGE_MAX_MAPPINGS_PER_USER=${FLAMEFORGE_MAX_MAPPINGS_PER_USER:-}
      - FLAMEFORGE_MAX_USERS=${FLAMEFORGE_MAX_USERS:-}
      - FLAMEFORGE_PUBLIC_STATS=${FLAMEFORGE_PUBLIC_STATS:-}
      - FLAMEFORGE_MULTI_USER_ALLOW_ENV_FALLBACK=${FLAMEFORGE_MULTI_USER_ALLOW_ENV_FALLBACK:-}
      - FLAMEFORGE_USER_RETENTION_DAYS=${FLAMEFORGE_USER_RETENTION_DAYS:-}
      # â”€â”€ Opzionali â€” Admin & Sicurezza â”€â”€
      # PUBLIC_INSTANCE=1: route admin aperte senza token (LAN fidata/demo).
      # Su istanze esposte lascia vuoto/0 + ADMIN_TOKEN, poi incolla il token
      # in Impostazioni â†’ Token admin (solo sessione) per usare la UI.
      # Senza entrambi, l'editor resta chiuso (fail-closed); gli endpoint
      # poster/cataloghi restano sempre aperti.
      - FLAMEFORGE_PUBLIC_INSTANCE=${FLAMEFORGE_PUBLIC_INSTANCE:-}
      - FLAMEFORGE_ADMIN_TOKEN=${FLAMEFORGE_ADMIN_TOKEN:-${FLAMEFORGE_ADMIN_TOKEN:-}}
      - FLAMEFORGE_ADMIN_TOKEN=${FLAMEFORGE_ADMIN_TOKEN:-}
      # Token warmup: l'app/entrypoint leggono FLAMEFORGE_/FLAMEFORGE_WARMUP_TOKEN
      # (il vecchio WARMUP_TOKEN senza prefisso non Ã¨ mai letto).
      - FLAMEFORGE_WARMUP_TOKEN=${FLAMEFORGE_WARMUP_TOKEN:-${FLAMEFORGE_WARMUP_TOKEN:-}}
      - FLAMEFORGE_WARMUP_TOKEN=${FLAMEFORGE_WARMUP_TOKEN:-}
      # Firma dei config token URL (CONFIG_HMAC_SECRET). Senza, i token non sono firmati.
      - CONFIG_HMAC_SECRET=${CONFIG_HMAC_SECRET:-}
      # Cifratura AES-256-GCM delle apiKeys dei profili cloud (openssl rand -hex 32).
      # Senza, le chiavi dei profili restano in chiaro a riposo (warning in prod).
      - PROFILE_ENCRYPTION_KEY=${PROFILE_ENCRYPTION_KEY:-}
      # Proxy fidato (dietro Cloudflare/Caddy/Nginx) e allowlist host pubblici
      - FLAMEFORGE_TRUST_PROXY=${FLAMEFORGE_TRUST_PROXY:-${FLAMEFORGE_TRUST_PROXY:-}}
      - FLAMEFORGE_CLIENT_IP_HEADER=${FLAMEFORGE_CLIENT_IP_HEADER:-}
      - FLAMEFORGE_ALLOWED_HOSTS=${FLAMEFORGE_ALLOWED_HOSTS:-${FLAMEFORGE_ALLOWED_HOSTS:-}}
      # Banner sponsor hosting pubblico (es. "elfhosted"; vuoto = nessun banner).
      - FLAMEFORGE_HOSTED_BY=${FLAMEFORGE_HOSTED_BY:-}

      # â”€â”€ Opzionali â€” Persistenza distribuita â”€â”€
      # Redis nativo (TCP) per HA multi-replica senza /data: FLAMEFORGE_REDIS_URL
      # vince su KV_REST_* (log warn, nessuna migrazione automatica). Su ElfHosted
      # basta REDIS_URL (fallback nudo supportato). Senza nessuno dei due resta il
      # volume /data sotto.
      - FLAMEFORGE_REDIS_URL=${FLAMEFORGE_REDIS_URL:-${REDIS_URL:-}}
      - KV_REST_API_URL=${KV_REST_API_URL:-}
      - KV_REST_API_TOKEN=${KV_REST_API_TOKEN:-}
      - FLAMEFORGE_KV_CACHE=${FLAMEFORGE_KV_CACHE:-}

      # â”€â”€ Opzionali â€” Cache â”€â”€
      - FLAMEFORGE_CACHE_MAX=${FLAMEFORGE_CACHE_MAX:-${FLAMEFORGE_CACHE_MAX:-2000}}
      - FLAMEFORGE_CACHE_MAX=${FLAMEFORGE_CACHE_MAX:-2000}
      - FLAMEFORGE_CACHE_MAX_MB=${FLAMEFORGE_CACHE_MAX_MB:-${FLAMEFORGE_CACHE_MAX_MB:-150}}
      - FLAMEFORGE_CACHE_MAX_MB=${FLAMEFORGE_CACHE_MAX_MB:-150}
      - FLAMEFORGE_CACHE_REFRESH_HOUR=${FLAMEFORGE_CACHE_REFRESH_HOUR:-${FLAMEFORGE_CACHE_REFRESH_HOUR:-3}}
      - FLAMEFORGE_CACHE_REFRESH_HOUR=${FLAMEFORGE_CACHE_REFRESH_HOUR:-3}
      # Byte-cache immagini TMDB e attesa rating: vuoti = default del codice
      # (32MB / 1500ms). Su VPS con RAM alzare IMG a 128.
      - FLAMEFORGE_IMG_CACHE_MB=${FLAMEFORGE_IMG_CACHE_MB:-}
      - FLAMEFORGE_RATING_WAIT_MS=${FLAMEFORGE_RATING_WAIT_MS:-}
      # Candidati clean del best-fit: vuoto = 16 (default del codice).
      - FLAMEFORGE_AUTO_FIT_CANDIDATE_COUNT=${FLAMEFORGE_AUTO_FIT_CANDIDATE_COUNT:-}

      # â”€â”€ Opzionali â€” Render pipeline (tuning performance) â”€â”€
      # Default tarati per il limite 512MB sotto. Su istanze con piÃ¹ RAM alza
      # FLAMEFORGE_MAX_CONCURRENT_RENDERS (es. 8) e la cache per piÃ¹ poster/s
      # sulle griglie fredde â€” vedi README "Tuning performance".
      - FLAMEFORGE_MAX_CONCURRENT_RENDERS=${FLAMEFORGE_MAX_CONCURRENT_RENDERS:-${FLAMEFORGE_MAX_CONCURRENT_RENDERS:-4}}
      - FLAMEFORGE_MAX_CONCURRENT_RENDERS=${FLAMEFORGE_MAX_CONCURRENT_RENDERS:-4}
      - FLAMEFORGE_RENDER_SLOT_WAIT_MS=${FLAMEFORGE_RENDER_SLOT_WAIT_MS:-${FLAMEFORGE_RENDER_SLOT_WAIT_MS:-15000}}
      - FLAMEFORGE_RENDER_SLOT_WAIT_MS=${FLAMEFORGE_RENDER_SLOT_WAIT_MS:-15000}
      - FLAMEFORGE_RENDER_TIMEOUT_MS=${FLAMEFORGE_RENDER_TIMEOUT_MS:-${FLAMEFORGE_RENDER_TIMEOUT_MS:-30000}}
      - FLAMEFORGE_RENDER_TIMEOUT_MS=${FLAMEFORGE_RENDER_TIMEOUT_MS:-30000}

      # â”€â”€ Opzionali â€” Sharp (ottimizzazione CPU/RAM) â”€â”€
      - SHARP_CONCURRENCY=${SHARP_CONCURRENCY:-2}
      - SHARP_CACHE_MEMORY_MB=${SHARP_CACHE_MEMORY_MB:-64}

      # â”€â”€ Opzionali â€” Logging â”€â”€
      - FLAMEFORGE_LOG_LEVEL=${FLAMEFORGE_LOG_LEVEL:-${FLAMEFORGE_LOG_LEVEL:-info}}
      - FLAMEFORGE_LOG_LEVEL=${FLAMEFORGE_LOG_LEVEL:-info}
      - FLAMEFORGE_LOG_FORMAT=${FLAMEFORGE_LOG_FORMAT:-${FLAMEFORGE_LOG_FORMAT:-}}
      - FLAMEFORGE_LOG_FORMAT=${FLAMEFORGE_LOG_FORMAT:-}

      # â”€â”€ Opzionali â€” CDN â”€â”€
      - POSTER_CDN_URL=${POSTER_CDN_URL:-}
      - NEXT_PUBLIC_POSTER_CDN_URL=${NEXT_PUBLIC_POSTER_CDN_URL:-}

      # â”€â”€ Runtime â”€â”€
      - NODE_ENV=production
      # Heap JS: default 384 (tarato per il limite 512MB sotto). Su VPS con
      # piÃ¹ RAM alzarlo via FLAMEFORGE_NODE_OLD_SPACE (es. 2048 con limite 3g).
      - NODE_OPTIONS=--max-old-space-size=${FLAMEFORGE_NODE_OLD_SPACE:-384}
      - PORT=8080
      - HOSTNAME=0.0.0.0
      # Self-warmup post-boot (default 1): 0 per saltarlo.
      - FLAMEFORGE_SELF_WARMUP=${FLAMEFORGE_SELF_WARMUP:-${FLAMEFORGE_SELF_WARMUP:-}}
    # Hardening: il container gira come utente non-root (uid 1000) e senza
    # capability aggiuntive; niente escalation di privilegi.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      # Nome volume legacy (posterium-*) tenuto per non orfanare i /data esistenti.
      # Non rinominarlo tra un recreate e l'altro: nomi diversi = volumi diversi
      # (lo storage sembrerebbe vuoto/"0 poster"). Deve restare scrivibile da uid 1000.
      - posterium-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/health?probe=1').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Rotation dei log json-file: senza limiti crescono senza bound su
    # istanze long-running (livello info logga ogni render best-fit).
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: ${FLAMEFORGE_MEM_LIMIT:-512M}
        reservations:
          memory: ${FLAMEFORGE_MEM_RESERVATION:-256M}

volumes:
  posterium-data:
    driver: local

